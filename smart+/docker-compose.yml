name: smart

services:
  smart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-app
    restart: always
    working_dir: /var/www/html
    command: php-fpm -F
    volumes:
      - smart-storage:/var/www/html/storage/app/public
      - smart-cache:/var/www/html/bootstrap/cache
      - smart-public:/var/www/html/public
    env_file:
      - path: .env
        required: false
    environment:
      - APP_NAME=SMART
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${SMART_APP_KEY:-base64:MZA3l3TM7NzHXfW4Jsr4Y2pCCpxu4b2wtFlZy4f8ULE=}
      - APP_URL=${SMART_APP_URL:-https://smart.smkpgri5serpong.sch.id}
      - DB_CONNECTION=mysql
      - DB_HOST=smart-db
      - DB_PORT=3306
      - DB_DATABASE=${DOCKER_DB_DATABASE:-smart}
      - DB_USERNAME=${DOCKER_DB_USERNAME:-smart_user}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD:-smart_secret_123}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SESSION_COOKIE=smart_absensi_session
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=smart-redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_DB=0
      - REDIS_PREFIX=smart_absensi_
      # CBT & AI Integration (OPENROUTER_API_KEY loaded via env_file .env)
      - CBT_API_BASE_URL=${DOCKER_CBT_API_BASE_URL:-http://smart-cbt-web/api/v1}
      - CBT_API_TOKEN=${CBT_API_TOKEN:-cbt_secret_token_smkpgri5_2026}
      - SMART_PLUS_API_TOKEN=${SMART_PLUS_API_TOKEN:-smart_secret_token_smkpgri5_2026}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
    depends_on:
      smart-db:
        condition: service_healthy
      smart-redis:
        condition: service_healthy
    networks:
      - smart-network

  smart-web:
    image: nginx:alpine
    container_name: smart-web
    restart: always
    ports:
      - "0.0.0.0:${APP_PORT:-8002}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - smart-storage:/var/www/html/storage/app/public:ro
      - smart-public:/var/www/html/public:ro
    depends_on:
      - smart-app
    networks:
      - smart-network

  smart-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-smkpgri5-smart-app:latest
    container_name: smart-scheduler
    restart: always
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - smart-storage:/var/www/html/storage/app/public
      - smart-cache:/var/www/html/bootstrap/cache
      - smart-public:/var/www/html/public
    env_file:
      - path: .env
        required: false
    environment:
      - APP_NAME=SMART
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${SMART_APP_KEY:-base64:MZA3l3TM7NzHXfW4Jsr4Y2pCCpxu4b2wtFlZy4f8ULE=}
      - APP_URL=${SMART_APP_URL:-https://smart.smkpgri5serpong.sch.id}
      - DB_CONNECTION=mysql
      - DB_HOST=smart-db
      - DB_PORT=3306
      - DB_DATABASE=${DOCKER_DB_DATABASE:-smart}
      - DB_USERNAME=${DOCKER_DB_USERNAME:-smart_user}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD:-smart_secret_123}
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=smart-redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_DB=0
      - REDIS_PREFIX=smart_absensi_
    depends_on:
      smart-db:
        condition: service_healthy
      smart-redis:
        condition: service_healthy
    networks:
      - smart-network

  smart-redis:
    image: redis:7-alpine
    container_name: smart-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - smart-cbt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-network

  smart-db:
    image: mysql:8.0
    container_name: smart-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_123}
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-smart}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-smart_user}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-smart_secret_123}
    volumes:
      - smart-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-network



  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smart-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN:-eyJhIjoiMGJlNGQwYmNlN2M3ZTUxOWE2OTg5NzUzNzIyYjU2OTEiLCJ0IjoiZTA3MjAyMTQtMTYwNS00ODk5LThjNjYtN2JjOWIwOTlhMjA4IiwicyI6Ik5URTRaR0kxWVRBdFpXVXdZaTAwT1ROa0xUZ3hOakV0TWpJMU9UUTNOVEJpTWpaayJ9}
    networks:
      - smart-network
    profiles:
      - tunnel

volumes:
  smart-db-data:
    name: ${DB_VOLUME_NAME:-smart-smkpgri5_smart-db-data}
  smart-storage:
    name: ${STORAGE_VOLUME_NAME:-smart-smkpgri5_smart-storage}
  smart-cache:
    name: ${CACHE_VOLUME_NAME:-smart-smkpgri5_smart-cache}
  smart-public:
    name: ${PUBLIC_VOLUME_NAME:-smart-smkpgri5_smart-public}
  smart-cbt-redis-data:
    name: ${CBT_VOLUME_REDIS:-smart-smkpgri5_smart-redis-data}

networks:
  smart-network:
    name: smart-network
    driver: bridge
